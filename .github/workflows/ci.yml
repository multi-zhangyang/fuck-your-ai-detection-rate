name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Regression checks
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm --prefix app ci

      - name: Run regression suite
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_regressions.py --include-browser-e2e --fail-fast

      - name: Verify one-click launcher
        shell: pwsh
        run: |
          & cmd.exe /d /c start_web.bat -NoBrowser
          if ($LASTEXITCODE -ne 0) {
            throw "start_web.bat failed with exit code $LASTEXITCODE"
          }
          $backend = Invoke-RestMethod -Uri http://127.0.0.1:8765/api/ping -TimeoutSec 5
          if (-not $backend.ok) {
            throw "Backend health check failed"
          }
          $frontend = Invoke-WebRequest -Uri http://127.0.0.1:1420 -UseBasicParsing -TimeoutSec 5
          if ($frontend.StatusCode -ne 200 -or -not $frontend.Content.Contains("FYADR")) {
            throw "Frontend health check failed"
          }
